[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}
version = {attr = "deltax.__version__"}

[project]
name = "deltax"
version = "0.1.0"
description = "A Python library for controlling DeltaX robots"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "PySide6>=6.0.0",
    "opencv-python>=4.0.0",
]
requires-python = ">=3.6"

[project.urls]
Homepage = "https://github.com/yourusername/deltax"